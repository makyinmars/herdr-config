onboarding = false
[theme]
name = "gruvbox"

[ui]
# Herdr 0.7.5 removed `agent_panel_scope`; omit it so config validation stays clean.
accent = "#d79921"

agent_panel_sort = "priority"
[keys]
# Ctrl+L is the Herdr leader. Prefix bindings are sequential:
# press and release Ctrl+L, then press the action key.
prefix = "ctrl+l"

# tmux-style pane/session controls. Copy mode uses Vim motions:
# h/j/k/l to move, / and ? to search, v to select, and y to copy.
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
detach = "prefix+d"
copy_mode = "prefix+["

# Use prefix+s for spaces/workspaces and keep settings on prefix+S.
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

# Focus panes from terminal mode with Prefix+h/j/k/l. The unprefixed
# navigation keys below apply only while Herdr's navigation UI is open.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = "l"

# Cycle through agents from the prefix.
next_agent = "prefix+."
previous_agent = "prefix+,"

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = false

[[keys.command]] # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]] # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
